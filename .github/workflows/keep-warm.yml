name: keep-render-warm

# Manual-only: pings both Render free-tier services (web + backend) so
# neither spins down from 15 minutes of inactivity. The actual scheduled
# keep-warm job now runs on UptimeRobot (real 5-min clock, not subject to
# GitHub's best-effort — and often ~1hr-delayed in practice — scheduler).
# This workflow is kept for on-demand testing via workflow_dispatch.
on:
  workflow_dispatch: {}

concurrency:
  group: keep-render-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            url: https://dannest-punh.onrender.com/
          - name: backend
            url: https://dannest-service-jauh.onrender.com/actuator/health
    steps:
      - name: Ping ${{ matrix.name }} (with retry for cold start)
        env:
          HEALTH_URL: ${{ matrix.url }}
        run: |
          set -eo pipefail
          # After a long idle gap (GitHub's scheduler doesn't reliably fire
          # every 5 min — real-world gaps can run 1-2+ hours), Render's cold
          # boot (image pull + JVM start for the backend) can take longer
          # than a "typical" 30-60s cold start. Budget generously so a slow
          # but real wake-up isn't reported as a failure.
          max_attempts=10
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Attempt $attempt/$max_attempts: GET $HEALTH_URL"
            if code=$(curl -sS -o /tmp/health_body.json -w '%{http_code}' --max-time 25 "$HEALTH_URL"); then
              echo "HTTP $code"
              cat /tmp/health_body.json
              echo
              if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
                echo "Service is warm."
                exit 0
              fi
            else
              echo "curl failed (timeout or connection error)"
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Not healthy yet — waiting 20s for Render cold start..."
              sleep 20
            fi
          done
          echo "::error::Service did not become healthy after $max_attempts attempts"
          exit 1
