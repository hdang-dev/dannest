name: deploy

# Run on every push to main: check + build + push + deploy ONLY the parts that changed.
#
# Pipeline: GitHub Actions (CI: check, build image, push to GHCR)
#           -> GHCR (image tagged with the commit SHA)
#           -> GitHub Actions (CD: tell Render to run that exact image)
#           -> Render (pulls the image, runs the container — never builds from source)
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Detect which folders changed in this push.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      core: ${{ steps.filter.outputs.core }}
      notification: ${{ steps.filter.outputs.notification }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
            core:
              - 'services/core/**'
            notification:
              - 'services/notification/**'

  # =============================== WEB ===============================
  check-web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-web:
    needs: [changes, check-web]
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/$owner/web:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.image }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_NOTIFICATION_API_URL=${{ vars.NEXT_PUBLIC_NOTIFICATION_API_URL }}

  deploy-web:
    needs: [build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy — web (exact image from CI)
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"imageUrl":"${{ needs.build-web.outputs.image }}"}' \
            "https://api.render.com/v1/services/srv-d955uk3tqb8s73eer9bg/deploys"

  # =============================== CORE ===============================
  check-core:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dannest
          POSTGRES_PASSWORD: dannest
          POSTGRES_DB: dannest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dannest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/core
    env:
      DB_URL: jdbc:postgresql://localhost:5432/dannest
      DB_USER: dannest
      DB_PASSWORD: dannest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon

  build-core:
    needs: [changes, check-core]
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/$owner/core:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./services/core
          file: ./services/core/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.image }}

  deploy-core:
    needs: [build-core]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy — core (exact image from CI)
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"imageUrl":"${{ needs.build-core.outputs.image }}"}' \
            "https://api.render.com/v1/services/srv-d955uk0js32c73ffde7g/deploys"

  # =========================== NOTIFICATION ===========================
  check-notification:
    needs: changes
    if: ${{ needs.changes.outputs.notification == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dannest
          POSTGRES_PASSWORD: dannest
          POSTGRES_DB: dannest_notification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dannest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/notification
    env:
      DB_URL: jdbc:postgresql://localhost:5432/dannest_notification
      DB_USER: dannest
      DB_PASSWORD: dannest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon

  build-notification:
    needs: [changes, check-notification]
    if: ${{ needs.changes.outputs.notification == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/$owner/notification:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./services/notification
          file: ./services/notification/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.image }}

  deploy-notification:
    needs: [build-notification]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy — notification (exact image from CI)
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"imageUrl":"${{ needs.build-notification.outputs.image }}"}' \
            "https://api.render.com/v1/services/srv-d9mqrofqj5pc73dk07k0/deploys"
