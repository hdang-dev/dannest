name: dannest

# Local dev infra shared by all backend services under services/. Each Spring Boot
# app still runs on the host via `./gradlew bootRun` — only its dependencies
# (Postgres, RabbitMQ) run in Docker.
services:
    postgres-core:
        image: postgres:17-alpine
        container_name: dannest-postgres-core
        restart: unless-stopped
        environment:
            POSTGRES_USER: dannest
            POSTGRES_PASSWORD: dannest
            POSTGRES_DB: dannest
        ports:
            - "5440:5432"
        volumes:
            - dannest_core_data:/var/lib/postgresql/data

    postgres-notification:
        image: postgres:17-alpine
        container_name: dannest-postgres-notification
        restart: unless-stopped
        environment:
            POSTGRES_USER: dannest
            POSTGRES_PASSWORD: dannest
            POSTGRES_DB: dannest_notification
        ports:
            - "5441:5432"
        volumes:
            - dannest_notification_data:/var/lib/postgresql/data

    # Management image includes a web UI at :15672 (guest/guest) — handy for
    # inspecting the dannest.events exchange/queue/bindings while learning.
    rabbitmq:
        image: rabbitmq:4-management-alpine
        container_name: dannest-rabbitmq
        restart: unless-stopped
        ports:
            - "5672:5672" # AMQP
            - "15672:15672" # management UI

    # Backs Core's refresh tokens only (see services/core/.../auth/RefreshTokenService).
    # No persistence volume — losing local dev data here just means everyone has to
    # log in again, which is fine.
    redis:
        image: redis:7-alpine
        container_name: dannest-redis
        restart: unless-stopped
        ports:
            - "6379:6379"

    # Backs services/media (see services/media/src/models/Media.js). Run with
    # `npm run dev` on the host, same as the Spring Boot services.
    mongo-media:
        image: mongo:7
        container_name: dannest-mongo-media
        restart: unless-stopped
        ports:
            - "27017:27017"
        volumes:
            - dannest_media_data:/data/db

volumes:
    dannest_core_data:
    dannest_notification_data:
    dannest_media_data:
