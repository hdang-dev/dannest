name: dannest

# Local dev infra shared by all backend services under services/. Each Spring Boot
# app still runs on the host via `./gradlew bootRun`, and marketplace via `npm run
# dev` — only their dependencies (Postgres, MongoDB, RabbitMQ) run in Docker.
services:
    postgres-core:
        image: postgres:17-alpine
        container_name: dannest-postgres-core
        restart: unless-stopped
        environment:
            POSTGRES_USER: dannest
            POSTGRES_PASSWORD: dannest
            POSTGRES_DB: dannest
        ports:
            - "5440:5432"
        volumes:
            - dannest_core_data:/var/lib/postgresql/data

    postgres-notification:
        image: postgres:17-alpine
        container_name: dannest-postgres-notification
        restart: unless-stopped
        environment:
            POSTGRES_USER: dannest
            POSTGRES_PASSWORD: dannest
            POSTGRES_DB: dannest_notification
        ports:
            - "5441:5432"
        volumes:
            - dannest_notification_data:/var/lib/postgresql/data

    # Management image includes a web UI at :15672 (guest/guest) — handy for
    # inspecting the dannest.events exchange/queue/bindings while learning.
    rabbitmq:
        image: rabbitmq:4-management-alpine
        container_name: dannest-rabbitmq
        restart: unless-stopped
        ports:
            - "5672:5672" # AMQP
            - "15672:15672" # management UI

    # Backs Core's refresh tokens only (see services/core/.../auth/RefreshTokenService).
    # No persistence volume — losing local dev data here just means everyone has to
    # log in again, which is fine.
    redis:
        image: redis:7-alpine
        container_name: dannest-redis
        restart: unless-stopped
        ports:
            - "6379:6379"

    # Backs services/marketplace (see services/marketplace/src/db/mongoose.ts). Run with
    # `npm run dev` on the host, same as the old media service used to.
    #
    # Runs as a single-node replica set (not a bare standalone) — the membership saga's
    # outbox write needs a real multi-document transaction (business row + outbox row,
    # atomically, same as Core's @Transactional does in Postgres), and MongoDB only
    # supports transactions on a replica set. Atlas (production) already is one; this
    # healthcheck is purely a local-dev concern — it idempotently self-initiates rs0 on
    # first boot (checks status first, only calls rs.initiate() if not already a member),
    # so no manual setup step or separate init container is needed.
    mongo-marketplace:
        image: mongo:7
        container_name: dannest-mongo-marketplace
        restart: unless-stopped
        command: ["--replSet", "rs0", "--bind_ip_all"]
        ports:
            - "27017:27017"
        volumes:
            - dannest_marketplace_data:/data/db
        healthcheck:
            test: >
                echo "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }"
                | mongosh --quiet
            interval: 5s
            timeout: 10s
            retries: 30

volumes:
    dannest_core_data:
    dannest_notification_data:
    dannest_marketplace_data:
