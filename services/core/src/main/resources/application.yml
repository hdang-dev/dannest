spring:
    application:
        name: dannest

    # --- Database connection ---
    # Values come from env vars if set, otherwise the defaults after ":" are used.
    # Same pattern as docker-compose's ${DB_PORT:-5440}. This keeps secrets out of
    # code in real environments while staying zero-config for local dev.
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5440/dannest}
        username: ${DB_USER:dannest}
        password: ${DB_PASSWORD:dannest}

    # --- JPA / Hibernate (the ORM) ---
    jpa:
        hibernate:
            # 'validate' = Hibernate checks the DB schema matches your entities but
            # never changes it. Flyway owns schema changes (via SQL migrations).
            # This is the safe, production-correct setup.
            ddl-auto: validate
        open-in-view: false # avoids a common performance foot-gun
        properties:
            hibernate:
                format_sql: true # pretty-prints SQL in logs (handy while learning)

    # --- Flyway (database migrations) ---
    # Looks for versioned SQL files in src/main/resources/db/migration
    flyway:
        enabled: true

    # --- RabbitMQ ---
    # Publishes domain events (new post, comment reply, ...) for other services —
    # today, just the notification service — to consume independently.
    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_USERNAME:guest}
        password: ${RABBITMQ_PASSWORD:guest}
        virtual-host: ${RABBITMQ_VHOST:/}
        ssl:
            enabled: ${RABBITMQ_SSL_ENABLED:false} # hosted brokers (amqps://) set this true
        # Default is 60s: with no broker reachable, that's how long a post/comment
        # request would hang before EventPublisher's catch kicks in. Fail fast instead.
        connection-timeout: 3000

    # --- File uploads (media) ---
    # Cap upload size; the frontend sends already-cropped WebP images.
    servlet:
        multipart:
            max-file-size: ${MEDIA_MAX_FILE_SIZE:5MB}
            max-request-size: ${MEDIA_MAX_FILE_SIZE:5MB}

    # --- Redis ---
    # Backs refresh tokens only (see jwt.refresh-token-expiration-seconds below).
    # No caching uses Redis yet.
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD:}
            ssl:
                enabled: ${REDIS_SSL_ENABLED:false} # hosted Redis (Upstash etc.) sets this true

# --- Actuator (health/monitoring) ---
# Expose only what we need; never expose everything publicly.
management:
    endpoints:
        web:
            exposure:
                include: health,info

server:
    port: ${SERVER_PORT:8090}

# --- Authentication ---
# Google Sign-In: the frontend gets a Google ID token; the backend verifies it
# (audience must equal this client id) and issues our own JWT.
google:
    # The Google OAuth client id is PUBLIC (exposed in the browser), so it's safe as a
    # committed default — this makes local dev work with no extra setup. Prod overrides
    # via the GOOGLE_CLIENT_ID env var (set in infra/). Must match the frontend's
    # NEXT_PUBLIC_GOOGLE_CLIENT_ID, or Google token verification returns 401.
    client-id: ${GOOGLE_CLIENT_ID:350344514147-tpdsko12kk5rh10i279o5pjp8j7s7dkk.apps.googleusercontent.com}

# Our app JWT (HS256). The dev default is INSECURE and for local only —
# production MUST set JWT_SECRET to a long random value (>= 32 bytes).
#
# Two tokens: a short-lived access token (stateless, checked by signature only)
# and a long-lived refresh token (an opaque random string, tracked in Redis so
# it can actually be revoked on logout — see RefreshTokenService).
jwt:
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-please-0123456789abcdef}
    access-token-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900} # 15 min
    refresh-token-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:2592000} # 30 days
    # Refresh token is set as an httpOnly cookie — never readable by JS. In prod the
    # frontend is on a different origin (Vercel vs Render), so it needs SameSite=None
    # + Secure; local dev is http on the same-site localhost, so it needs SameSite=Lax
    # (SameSite=None is rejected by browsers without Secure/HTTPS).
    refresh-cookie:
        name: dannest_refresh_token
        secure: ${JWT_REFRESH_COOKIE_SECURE:false}
        same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:Lax}

# Which frontend origins may call the API (comma-separated).
app:
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    # --- Feed cache (Redis) ---
    # How long a cached feed page (which post ids belong on it) can go stale before
    # self-healing, between explicit evictions on new-post creation. Not load-bearing
    # for correctness — likes/comments/likedByMe are always computed live regardless.
    cache:
        feed-ttl-seconds: ${FEED_CACHE_TTL_SECONDS:20}

# Object storage (Cloudflare R2) moved to services/media — Core no longer uploads
# bytes or talks to R2 directly (see docs/tech/architecture-flows.md).
