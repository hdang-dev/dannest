spring:
    application:
        name: dannest-notification

    # --- Database connection ---
    # This service owns its own database — no tables/FKs shared with Core.
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5441/dannest_notification}
        username: ${DB_USER:dannest}
        password: ${DB_PASSWORD:dannest}

    # --- JPA / Hibernate (the ORM) ---
    jpa:
        hibernate:
            ddl-auto: validate # Flyway owns schema changes
        open-in-view: false
        properties:
            hibernate:
                format_sql: true

    # --- Flyway (database migrations) ---
    flyway:
        enabled: true

    # --- RabbitMQ ---
    # Consumes domain events published by Core on the shared `dannest.events` exchange.
    # Queue/binding declared in code — see config/RabbitConfig.java.
    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_USERNAME:guest}
        password: ${RABBITMQ_PASSWORD:guest}
        virtual-host: ${RABBITMQ_VHOST:/}
        ssl:
            enabled: ${RABBITMQ_SSL_ENABLED:false} # hosted brokers (amqps://) set this true

# --- Actuator (health/monitoring) ---
management:
    endpoints:
        web:
            exposure:
                include: health,info

server:
    port: ${SERVER_PORT:8091}

# Our app JWT (HS256) — MUST match Core's `jwt.secret`, since this service verifies
# (but never issues) tokens signed by Core. Same env var name, same dev default,
# so local dev works with zero extra config.
jwt:
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-please-0123456789abcdef}

# Which frontend origins may call this API (comma-separated) — same as Core.
app:
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
